<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PROTOTYPE · GLiNER browser benchmark</title>
  <style>
    body { font: 14px/1.4 ui-monospace, Menlo, monospace; margin: 24px; background: #111; color: #ddd; }
    h1 { font-size: 16px; } .warn { color: #f90; }
    pre { background: #000; padding: 12px; white-space: pre-wrap; }
    button, select { font: inherit; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>PROTOTYPE, throwaway: GLiNER-PII in the browser. Gate: &lt; 300 ms per prompt.</h1>
  <p class="warn">Params: ?model=edge|small &amp;dtype=quint8|fp16|fp32 &amp;ep=wasm|webgpu &amp;threads=N &amp;auto=1</p>
  <div>
    <select id="model"><option>edge</option><option>small</option></select>
    <select id="dtype"><option>quint8</option><option>fp16</option><option>fp32</option></select>
    <select id="ep"><option>wasm</option><option>webgpu</option></select>
    <button id="run">Run</button>
  </div>
  <pre id="out">idle</pre>
  <script type="module" src="/bench.js"></script>
</body>
</html>
